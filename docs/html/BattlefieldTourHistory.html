              3.1173759,

            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">La Ferte Sous Jouarre Memorial<br>26 Aug 14<br> Henry Goodfellow Memorial Stone 9</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/la-ferte-jouarre-mem.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'The monument honours 3,700 British and Irish Soldiers who were killed between Aug and Oct 1914 and have no known grave. Henry Goodfellow, 2nd Suffolks was killed at the Battle of Le Cateau on 26 Aug 1914.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/pre-season-tour-la-fert\u00e9-sous-jouarre-memorial-to-the-missing/\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/pre-season-tour-la-fert\u00e9-sous-jouarre-memorial-to-the-missing/</a>\n                    </div>\n                </div>\n                    ",

            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Suffolk Hill Memorial<br>26 Aug 14<br> 2nd Suffolks Memorial Henry Goodfellow </h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/suffolkmemorial.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'A memorial was dedicated by Gen Smith-Dorrien on 26 May 1926 at the site at the centre of the Suffolk Regiment stand. The memorial is dedicated to all units who supported the Suffolks during the battle but is generally known as the Suffolk Memorial. The memorial denotes the members of the 2nd Battalion Suffolk Regiment, 2nd Battalion Manchester Regiment, 2nd Battalion Argyll and Sutherland Highlander Regiment and Royal Regiment of Artillery who were killed at Le Cateau. 75 members of the 2nd Suffolks with no known grave are honoured on this memorial.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/lance-sgt-6537henry-goodfellow\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/lance-sgt-6537henry-goodfellow</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Suffolk Hill Memorial<br>26 Aug 14<br></h2>\n                        <p>2nd Suffolks Memorial Henry Goodfellow <br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              3.1841254,
              50.2213462
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Sancourt British Cemetery<br>10 Sep 14<br> Robert Connelly Plot 1, Row B, Grave 11</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/SancourtBritishCemetery.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'Robert joined the 1st Battalion after the Canadians suffered heavy casualties in Jun 1916. He fought at Vimy, Hill 70 and Passchendaele where he won the Military Medal. He was killed at the Battle of Canal du Nord  on 30 Sep 1918.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/sgt-robert-connelly-1\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/sgt-robert-connelly-1</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/sancourt-british-cemetery\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/sancourt-british-cemetery</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Sancourt British Cemetery<br>10 Sep 14<br></h2>\n                        <p>Robert Connelly Plot 1, Row B, Grave 11<br></p>\n                    </div>\n                    "
          },
          {

            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Courcelette<br>16 Sep 16<br> William Johnston Wounded</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/Courcelette15Sep1916.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'Bill joined the 58th Battalion after the Canadians suffered heavy casualties in Jun 1916. He was wounded at Courcelette on 16 Sep 1916. He spent the rest of the war in England around Folkestone. He met and married his wife Annie. <br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/following-grandfather-s-footsteps\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/following-grandfather-s-footsteps</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Courcelette<br>16 Sep 16<br></h2>\n                        <p>William Johnston Wounded<br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              2.7687267,
              50.4601614
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Loos Memorial<br>03 Nov 15<br> Walter Goodfellow Memorial Panel 37 and 38</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/LoosMemorial.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'The Loos Memorial to the missing commemorates more than 20,000 names of  soldiers killed between 25 Sep 1915 and the End of the War in the region for the River Lys to Grenay near Lens, with no known Grave. Walter Goodfellow 7th Suffolks was killed at the Hohenzollern Redoubt on 3 Nov 1915.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/walter-james-goodfellow-7th-battalion-suffolk-regiment\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/walter-james-goodfellow-7th-battalion-suffolk-regiment</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/dud-corner-cemetery-walter-goodfellow\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/dud-corner-cemetery-walter-goodfellow</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/goodfellow-brothers-last-stand\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/goodfellow-brothers-last-stand</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Loos Memorial<br>03 Nov 15<br></h2>\n                        <p>Walter Goodfellow Memorial Panel 37 and 38<br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              2.8889439,
              50.8519971
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Menin Gate<br>08 May 15<br> Ernest Goodfellow - Panel 21</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/MeninGate.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'55,000 names are commemorated on this magnicent structure, covering the Ypres Salient up to 15 Aug 1917.  Ernest Goodfellow, 1st Suffolks,  was killed 8 May 1915 at the Battle of Frezenberg Ridge.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/ernest-goodfellow-1st-battalion-suffolk-regiment\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/ernest-goodfellow-1st-battalion-suffolk-regiment</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/canadians-at-second-battle-of-ypres-april-1915\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/canadians-at-second-battle-of-ypres-april-1915</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/goodfellow-brothers-last-stand\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/goodfellow-brothers-last-stand</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Menin Gate<br>08 May 15<br></h2>\n                        <p>Ernest Goodfellow - Panel 21<br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              -0.2584432,
              49.2311045
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Ranville Military Cemetery<br>18 Jul 44<br> F/L Robert McKenzie</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/RobertMcKenzieGraveMarker.png\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'Family Member Robert McKenzie, 438 Squadron Typhoon Pilot  was killed in action during a dive-bombing attack on a bridge over the River Orne, France. His aircraft, Typhoon MN 707, was hit with flak (anti-aircraft fire), went into a spiral and crashed. <br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/final-flight-for-robert-mckenzie\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/final-flight-for-robert-mckenzie</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Ranville Military Cemetery<br>18 Jul 44<br></h2>\n                        <p>F/L Robert McKenzie<br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              3.52006,
              51.39237
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Closing the Breskens Pocket<br>27 Oct 44<br> Christopher Cadeau Killed</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/ChristopherCadeau.jpg\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'The Coys began what was to prove to be a very difficult day. \"A\" Coy had kept on but were now enduring painfully heavy shelling. Allwent well until suddenly 9 Pl found itself fired on by machine guns at point-blank range. They were travelling along a road at the foot of a dyke and were met by a hail of fire from all sides. The enemy had allowed them to pass through and had then closed in. It was a well-planned and well-executed manoeuvre by the defending Paratroopers of the German Army. 9 Pl's runner, Pte Bowling, was sent back to warn Coy HQ of the situation.  A bloody battle ensued with every ounce of fighting energy that the gallant \"A\" Coy men possessed. 4 CanScots were killed including Christoper Cadeau, 5 wounded and 40 missing.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/joseph-christopher-raymond-cadeau\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/joseph-christopher-raymond-cadeau</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Closing the Breskens Pocket<br>27 Oct 44<br></h2>\n                        <p>Christopher Cadeau Killed<br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              -0.290456,
              49.06356
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Operation Totalize<br>08 Aug 44<br> Les Allen Wounded</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/LesAllenSoldier.jpg\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'At approx 0830 hrs, the enemy counter-attacked with tanks. Panther tanks moved up the CAEN\u2013FALAISE Highway, and we were also fired on by tanks from the far side of CRAMESNIL. One Panther tank penetrated our positions and approached within about 25 yds of Bn HQ. Heavy casualties, both in personnel and vehicles, were suffered by the fire of MMGs [Medium Machine Guns] attached to the Bn. Our 3@ Mortar Pln also suffered heavily, losing four carriers complete with ammunition that were burned out and two mortars. Three mortarmen were wounded. The Royal Regiment of Canada\u2019s mortar line and that of the supporting platoon of Toronto Scots\u2019 4.2in mortars had been caught while they were still digging in, and the single tank in the area was knocked out with the carriers suffering the same fate one by one. Both of these mortar platoons were necessarily much further forward than the artillery because of their relatively short range.3 The Torontos also lost medium machine guns to enemy fire before the German attack petered out.  At 1400 the Battalion moved forward to take Gaumesnil.  The RRC advanced more than 9 km in a single day. 2 officers wounded, 3 OR killed, 33 wounded including Cpl Leslie Allen who was seriously wounded.  <br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/uncle-les-allen-in-operation-totalize\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/uncle-les-allen-in-operation-totalize</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Operation Totalize<br>08 Aug 44<br></h2>\n                        <p>Les Allen Wounded<br></p>\n                    </div>\n                    "
          },
          {
            "lngLat": [
              6.567779,
              53.219955
            ],
            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Eelde<br>08 May 45<br> 8th Hussars in Eelde after the war ended.</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/norm.jpg\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'\u00a0At 2230 hrs the long awaited for message was received from rear 5 Cdn Arnd Bde, \"Cancel all offensive operations, cease fire at 0800 hrs 5 May 45\"  The jubilation of the Dutch people was tremendous and celebrations took place all day. A service was held in the EELDE (215048) protestant church.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/sergeant-norm-kightley-8th-hussars\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/sergeant-norm-kightley-8th-hussars</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/breaking-the-gothic-line\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/breaking-the-gothic-line</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/the-river-battles-italy-1944\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/the-river-battles-italy-1944</a>\n                    </div>\n                </div>\n                    ",
            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Eelde<br>08 May 45<br></h2>\n                        <p>8th Hussars in Eelde after the war ended.<br></p>\n                    </div>\n                    "
          }
        ],

            "tooltip": "\n                    <div style=\"text-align: center;\">\n                        <h2>Lochnagar Crater<br>01 Jul 16<br></h2>\n                        <p>Largest Crater in WWI<br></p>\n                    </div>\n                    "

          {

            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Leopold Canal<br>10 Oct 44<br> Percy Mervyn Killed</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/PercyMervyn.jpg\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'During the morning A Coy assisted the Regina Rif in destroying an enemy held pill box. Another C Coy patrol to GRAFF JAN failed to contact the enemy but rescued a wounded B Coy man who had been left when his coy withdrew on the previous day. Enemy shelling was slightly less intense than during the first three days, SA fire continued to make it extremely difficult and dangerous to move about. Supplies the Canal. Capt H.C. Chadderton of Coy and Lt L. Mendels of B Coy were among the numerous cas for the day. Percy Mervyn was killed.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/private-percy-mervyn-at-the-leopold-canal\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/private-percy-mervyn-at-the-leopold-canal</a>\n                    </div>\n                </div>\n                    ",

            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">George Johnston POW<br>07 Mar 45<br> George Johnston taken as a Prisoner of War</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/GeorgeJohnstonUnit.jpg\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'In the afternoon B and C Coys advanced along the main road as far as the crossroads at 106354 (4304) where they were pinned down by MG fire. One tank was knocked out by enemy 88mmAP at this point. After last light, B Coy supported by tanks, advanced into the Southern part of the little town. At dawn they were in shallow pits and dominated by German fire from 3 sides. Movement was impossible and the ammunition used up, so Capt Perry surrendered his force. A total of 31 members were taken prisoner including Lts Maxwell and Steward who were both severely wounded, and our great Uncle George Johnston. Lt Stewart later died of his wounds and was buried by the Germans in Veen.  In the picture, George is in the third row second from the right.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/uncle-george-johnston\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/uncle-george-johnston</a>\n                    </div>\n                </div>\n                    ",

            "popup": "\n                <div style=\"text-align: center; max-width:  600px\">\n                    <h2 style=\"margin: 0 0 10px 0; color: #2c3e50;\">Slovenia<br>23 Jun 15<br> From the sea to the Apls</h2>\n                    <img src=\"https://pd-allen.github.io/docs/images/lakebled.jpg\" width=\"550px\" style=\"border-radius:8px;\">\n                    <div style=\"text-align: left; padding: 0 10px;\">\n                       <p>'Slovenia had been inhabited since prehistoric times and claims to have the oldest musical instrument in the world, a 60,000-year-old flute made of the femur of a cave bear. On 23 June 1915, Italy launched the first attack with a frontal assault with 225,000 troops. Despite being outnumber 3 to 1, the Austro-Hungarians, having used the month to build substantial defences, mowed down the Italian troops with machine guns as the Italians had to attack up steep hills with little supporting Italian artillery fire. This was the first of 12 battles of the Isonzo River.<br></p>\n                        <a href=\"https://www.paulsbattlefieldtours.com/post/remind-me-where-slovenia-is\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/remind-me-where-slovenia-is</a><br><a href=\"https://www.paulsbattlefieldtours.com/post/slovenia-in-wwi\" target=\"_blank\" style=\"color: blue; font-weight: bold; text-decoration: underline;\">https://www.paulsbattlefieldtours.com/post/slovenia-in-wwi</a>\n                    </div>\n                </div>\n                    ",

                            maxWidth: tooltipMaxWidth
                        });
                        const markerEl = marker.getElement();
                        markerEl.addEventListener('mouseenter', () => {

                    }
                    // Track for layer control

                            });

                case 'addColorbar': {

                    cbDiv.style.cssText = `

                        : `display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px;`;

                case 'flyTo': {

                case 'fitBounds': {

                case 'setVisibility': {

                                    const pointPatterns = ['poi','pois','point','place','places','marker','stop','station','node','peak','city','town','village','label','symbol','icon','address','physical_point','mountain_peak'];
                                    for (const p of linePatterns) { if (lower === p || lower.includes(p)) return 'line'; }
                                    for (const p of pointPatterns) { if (lower === p || lower.includes(p)) return 'circle'; }
                                    return 'fill';
                                }

                                    if (mlType === 'fill') return { 'fill-color': color, 'fill-opacity': op * 0.6, 'fill-outline-color': color };
                                    if (mlType === 'line') return { 'line-color': color, 'line-width': 2, 'line-opacity': op };

                                    color: colors[i],
                                    mlType: vl.geometry_type ? geoToType(vl.geometry_type) : inferFromName(vl.id),

                                entries.sort((a, b) => (order[a.mlType] || 0) - (order[b.mlType] || 0));

                                            .anymap-pmtiles-popup td { padding:4px 8px;border-bottom:1px solid #eee;color:#333;word-break:break-word;overflow-wrap:break-word; }
                                            .anymap-pmtiles-popup tr:last-child td { border-bottom:none; }
                                            .anymap-pmtiles-popup td:first-child { font-weight:600;color:#222;white-space:nowrap;width:40%; }
                                            .anymap-pmtiles-popup td:last-child { color:#444;width:60%; }
                                            .anymap-pmtiles-popup .section-header { font-weight:700;font-size:13px;color:#111;padding:6px 8px 4px 8px;text-transform:capitalize;background:#f0f0f0;border-bottom:1px solid #ddd; }
                                        </style>`;

                                            if (tmpl) {
                                                const replaced = tmpl.replace(/\{(\w+)\}/g, (m, k) => p[k] !== undefined ? String(p[k]) : m);

                                    );
                                }

                case 'removePMTilesLayer': {

                    container.appendChild(slider);
                    container.appendChild(playBtn);

                    const controlContainer = map.getContainer().querySelector(`.maplibregl-ctrl-${position}`);
                    if (controlContainer) {
                        controlContainer.appendChild(container);
                    } else {
                        map.getContainer().appendChild(container);
                    }
                    timeSliderContainer = container;

                    if (autoPlay) {
                        playBtn.click();
                    }
                    break;
                }

                case 'removeTimeSlider': {
                    if (timeSliderContainer) {
                        timeSliderContainer.remove();
                        timeSliderContainer = null;
                    }
                    break;
                }

                case 'animateAlongRoute': {
                    const id = kwargs.id;
                    const coordinates = kwargs.coordinates;
                    const duration = kwargs.duration || 10000;
                    const loop = kwargs.loop !== false;
                    const markerColor = kwargs.markerColor || '#3388ff';
                    const markerSize = kwargs.markerSize || 1.0;
                    const showTrail = kwargs.showTrail === true;
                    const trailColor = kwargs.trailColor || '#3388ff';
                    const trailWidth = kwargs.trailWidth || 3;

                    const routeLength = _lineLength(coordinates);

                    const marker = new maplibregl.Marker({ color: markerColor, scale: markerSize })
                        .setLngLat(coordinates[0])
                        .addTo(map);

                    let trailSourceId;
                    let trailLayerId;
                    if (showTrail) {
                        trailSourceId = `${id}-trail-source`;
                        trailLayerId = `${id}-trail`;

                        if (!map.getSource(trailSourceId)) {
                            map.addSource(trailSourceId, {
                                type: 'geojson',
                                data: {
                                    type: 'Feature',
                                    properties: {},
                                    geometry: { type: 'LineString', coordinates: [] },
                                },
                            });
                        }

                        if (!map.getLayer(trailLayerId)) {
                            map.addLayer({
                                id: trailLayerId,
                                type: 'line',
                                source: trailSourceId,
                                paint: {
                                    'line-color': trailColor,
                                    'line-width': trailWidth,
                                    'line-opacity': 0.8,
                                },
                            });
                        }
                    }

                    const startTime = performance.now();
                    const trailCoords = [coordinates[0]];

                    const animate = (currentTime) => {
                        const animation = animations.get(id);
                        if (!animation) return;

                        if (animation.isPaused) {
                            animation.animationId = requestAnimationFrame(animate);
                            return;
                        }

                        let elapsed = (currentTime - animation.startTime) * animation.speed;
                        if (animation.pausedAt > 0) {
                            elapsed = (currentTime - animation.pausedAt + (animation.pausedAt - animation.startTime)) * animation.speed;
                        }

                        const progress = (elapsed % animation.duration) / animation.duration;
                        const distance = progress * routeLength;
                        const position = _pointAlong(coordinates, distance);

                        animation.marker.setLngLat(position);

                        if (showTrail && trailSourceId) {
                            trailCoords.push(position);
                            const source = map.getSource(trailSourceId);
                            if (source) {
                                source.setData({
                                    type: 'Feature',
                                    properties: {},
                                    geometry: { type: 'LineString', coordinates: trailCoords },
                                });
                            }
                        }

                        if (elapsed >= animation.duration && !loop) {
                            cancelAnimationFrame(animation.animationId);
                            animation.marker.remove();
                            if (animation.trailLayerId && map.getLayer(animation.trailLayerId)) {
                                map.removeLayer(animation.trailLayerId);
                            }
                            if (animation.trailSourceId && map.getSource(animation.trailSourceId)) {
                                map.removeSource(animation.trailSourceId);
                            }
                            animations.delete(id);
                            return;
                        }

                        animation.animationId = requestAnimationFrame(animate);
                    };

                    animations.set(id, {
                        animationId: requestAnimationFrame(animate),
                        marker,
                        isPaused: false,
                        speed: 1,
                        startTime,
                        pausedAt: 0,
                        duration,
                        coordinates,
                        loop,
                        trailSourceId,
                        trailLayerId,
                    });
                    break;
                }

                case 'pauseAnimation': {
                    const [id] = args;
                    const animation = animations.get(id);
                    if (!animation) break;
                    animation.isPaused = true;
                    animation.pausedAt = performance.now();
                    break;
                }

                case 'resumeAnimation': {
                    const [id] = args;
                    const animation = animations.get(id);
                    if (!animation || !animation.isPaused) break;
                    const pausedDuration = performance.now() - animation.pausedAt;
                    animation.startTime += pausedDuration;
                    animation.isPaused = false;
                    animation.pausedAt = 0;
                    break;
                }

                case 'setAnimationSpeed': {
                    const [id, speed] = args;
                    const animation = animations.get(id);
                    if (!animation) break;
                    animation.speed = speed;
                    break;
                }

                case 'stopAnimation': {
                    const [id] = args;
                    const animation = animations.get(id);
                    if (!animation) break;
                    cancelAnimationFrame(animation.animationId);
                    animation.marker.remove();
                    if (animation.trailLayerId && map.getLayer(animation.trailLayerId)) {
                        map.removeLayer(animation.trailLayerId);
                    }
                    if (animation.trailSourceId && map.getSource(animation.trailSourceId)) {
                        map.removeSource(animation.trailSourceId);
                    }
                    animations.delete(id);
                    break;
                }

                default:
                    console.log('Unknown method:', method);
            }
        }

        function getDefaultPaint(layerType) {
            const defaults = {
                circle: {
                    'circle-radius': 5,
                    'circle-color': '#3388ff',
                    'circle-opacity': 0.8,
                    'circle-stroke-width': 1,
                    'circle-stroke-color': '#ffffff'
                },
                line: {
                    'line-color': '#3388ff',
                    'line-width': 2,
                    'line-opacity': 0.8
                },
                fill: {
                    'fill-color': '#3388ff',
                    'fill-opacity': 0.5,
                    'fill-outline-color': '#0000ff'
                },
                raster: {
                    'raster-opacity': 1
                }
            };
            return defaults[layerType] || {};
        }

        function getOpacityProperty(layerType) {
            const opacityMap = {
                fill: 'fill-opacity',
                line: 'line-opacity',
                circle: 'circle-opacity',
                symbol: 'icon-opacity',
                raster: 'raster-opacity',
                'fill-extrusion': 'fill-extrusion-opacity'
            };
            return opacityMap[layerType];
        }

        let layerControlInstance = null;
        let layerControlOrderSyncTimer = null;

        function reorderDeckLayersFromLayerControl(layerOrder) {
            if (deckLayers.size <= 1) return;

            const currentLayers = new Map(deckLayers);
            const orderedDeckIds = layerOrder.filter(layerId => currentLayers.has(layerId));
            const seen = new Set();
            const reorderedEntries = [];

            for (const layerId of orderedDeckIds) {
                if (!currentLayers.has(layerId) || seen.has(layerId)) continue;
                reorderedEntries.push([layerId, currentLayers.get(layerId)]);
                seen.add(layerId);
            }

            for (const [layerId, layer] of currentLayers) {
                if (seen.has(layerId)) continue;
                reorderedEntries.push([layerId, layer]);
            }

            deckLayers.clear();
            for (const [layerId, layer] of reorderedEntries) {
                deckLayers.set(layerId, layer);
            }
        }

        function getSentinelBeforeIdForLayerControlOrder(layerOrder) {
            let lastDeckIndex = -1;
            for (let i = 0; i < layerOrder.length; i++) {
                if (deckLayers.has(layerOrder[i])) {
                    lastDeckIndex = i;
                }
            }

            if (lastDeckIndex < 0) {
                return undefined;
            }

            for (let i = lastDeckIndex + 1; i < layerOrder.length; i++) {
                const layerId = layerOrder[i];
                if (layerId !== DECK_SENTINEL_ID && map.getLayer(layerId)) {
                    return layerId;
                }
            }

            return undefined;
        }

        function handleLayerControlReorder(layerOrder) {
            if (deckLayers.size === 0) return;

            reorderDeckLayersFromLayerControl(layerOrder);

            if (!map.getLayer(DECK_SENTINEL_ID)) {
                updateDeckOverlay(true);
                return;
            }

            const sentinelBeforeId = getSentinelBeforeIdForLayerControlOrder(layerOrder);

            try {
                map.moveLayer(DECK_SENTINEL_ID, sentinelBeforeId);
            } catch (_err) {
                // Ignore unsupported move failures from custom/non-style layers.
            }

            updateDeckOverlay(true);
        }

        function getLayerControlOrder() {
            const styleLayers = map.getStyle()?.layers || [];
            const deckLayerIds = Array.from(deckLayers.keys());
            if (styleLayers.length === 0) {
                return deckLayerIds;
            }

            const orderedLayerIds = [];
            let insertedDeckLayers = false;

            for (const layer of styleLayers) {
                if (layer.id === DECK_SENTINEL_ID) {
                    if (!insertedDeckLayers) {
                        orderedLayerIds.push(...deckLayerIds);
                        insertedDeckLayers = true;
                    }
                    continue;
                }
                orderedLayerIds.push(layer.id);
            }

            if (!insertedDeckLayers) {
                orderedLayerIds.push(...deckLayerIds);
            }

            return orderedLayerIds;
        }

        function syncLayerControlOrder() {
            if (!layerControlInstance) return;

            const layerStates = layerControlInstance.state && layerControlInstance.state.layerStates;
            if (!layerStates || typeof layerControlInstance.buildLayerItems !== 'function') {
                return;
            }

            const desiredOrder = getLayerControlOrder();
            if (desiredOrder.length === 0) {
                return;
            }

            const currentOrder = Object.keys(layerStates);
            const hasBackground = currentOrder.includes('Background');
            const currentLayerIds = currentOrder.filter(layerId => layerId !== 'Background');
            const currentSet = new Set(currentLayerIds);
            const desiredSet = new Set(desiredOrder);
            const reorderedIds = [
                ...desiredOrder.filter(layerId => currentSet.has(layerId)),
                ...currentLayerIds.filter(layerId => !desiredSet.has(layerId)),
            ];

            if (reorderedIds.length === 0) {
                return;
            }

            const isSameOrder = reorderedIds.length === currentLayerIds.length
                && reorderedIds.every((layerId, index) => layerId === currentLayerIds[index]);
            if (isSameOrder) {
                return;
            }

            const reorderedStates = {};
            if (hasBackground && Object.prototype.hasOwnProperty.call(layerStates, 'Background')) {
                reorderedStates.Background = layerStates.Background;
            }
            reorderedIds.forEach((layerId) => {
                reorderedStates[layerId] = layerStates[layerId];
            });

            layerControlInstance.state.layerStates = reorderedStates;
            layerControlInstance.targetLayers = hasBackground
                ? ['Background', ...reorderedIds]
                : [...reorderedIds];
            layerControlInstance.buildLayerItems();
        }

        function scheduleLayerControlOrderSync() {
            if (!layerControlInstance) return;
            if (layerControlOrderSyncTimer !== null) {
                window.clearTimeout(layerControlOrderSyncTimer);
            }
            layerControlOrderSyncTimer = window.setTimeout(() => {
                syncLayerControlOrder();
                layerControlOrderSyncTimer = null;
            }, 150);
        }

        function createLayerControl(config) {
            const position = config.position || 'top-right';
            const collapsed = config.collapsed !== false;

            // Build layer IDs from addedLayers (excludes COG layers managed by adapter)
            const layerIds = addedLayers.map(layer => layer.id);

            // Include custom adapters for non-native layer types
            const customAdapters = [];
            if (deckLayers.size > 0) customAdapters.push(cogLayerAdapter);
            if (markerGroups.size > 0) customAdapters.push(markerLayerAdapter);

            layerControlInstance = new LayerControl({
                collapsed: collapsed,
                layers: layerIds,
                customLayerAdapters: customAdapters.length > 0 ? customAdapters : undefined,
                onLayerReorder: handleLayerControlReorder,
            });
            map.addControl(layerControlInstance, position);
            syncLayerControlOrder();
            scheduleLayerControlOrderSync();
        }

        function createGeoAgentControl(config) {
            if (!GeoAgentControlClass) {
                console.warn('GeoAgent library unavailable — skipping GeoAgent control');
                return;
            }
            if (geoAgentControl) {
                map.removeControl(geoAgentControl);
                geoAgentControl = null;
            }

            const position = config.position || 'top-right';
            geoAgentControl = new GeoAgentControlClass({
                ...config,
                position,
            });
            map.addControl(geoAgentControl, position);
            installGeoAgentEventGuards(geoAgentControl);
        }

        function installGeoAgentEventGuards(control) {
            const elements = [
                typeof control.getContainer === 'function' ? control.getContainer() : null,
                typeof control.getPanel === 'function' ? control.getPanel() : null,
            ].filter(Boolean);
            const guardedEvents = [
                'keydown',
                'keypress',
                'keyup',
                'beforeinput',
                'input',
                'compositionstart',
                'compositionupdate',
                'compositionend',
                'mousedown',
                'mouseup',
                'click',
                'dblclick',
                'pointerdown',
                'pointerup',
                'touchstart',
                'touchend',
                'wheel',
            ];
            const stop = event => event.stopPropagation();
            for (const element of elements) {
                if (element.dataset.anymapGeoagentEventGuards === 'true') continue;
                element.dataset.anymapGeoagentEventGuards = 'true';
                for (const eventName of guardedEvents) {
                    element.addEventListener(eventName, stop);
                }
            }
        }

        function createDrawControl(config) {
            // Check if Geoman is available (UMD exports to Geoman.Geoman)
            const GeomanClass = (typeof Geoman !== 'undefined' && Geoman.Geoman)
                ? Geoman.Geoman
                : (typeof window !== 'undefined' && window.Geoman && window.Geoman.Geoman)
                    ? window.Geoman.Geoman
                    : null;

            if (!GeomanClass) {
                console.warn('Geoman library not loaded. Draw control not available.');
                return;
            }

            const position = config.position || 'top-right';
            const drawModes = config.drawModes || ['polygon', 'line', 'rectangle', 'circle', 'marker'];
            const editModes = config.editModes || ['select', 'drag', 'change', 'rotate', 'cut', 'delete', 'scale', 'copy', 'split', 'union', 'difference', 'simplify', 'lasso'];
            const collapsed = config.collapsed || false;

            // Initialize Geoman first
            const geoman = new GeomanClass(map, {});
            let editorCreated = false;

            const createEditor = () => {
                if (editorCreated) return;
                editorCreated = true;

                if (GeoEditorClass) {
                    // Use full GeoEditor UI (matches Jupyter widget behavior)
                    try {
                        const geoEditor = new GeoEditorClass({
                            position,
                            drawModes,
                            editModes,
                            fileModes: ['open', 'save'],
                            collapsed,
                            showFeatureProperties: false,
                            fitBoundsOnLoad: true,
                        });
                        geoEditor.setGeoman(geoman);
                        map.addControl(geoEditor, position);
                    } catch (error) {
                        console.error('Failed to create GeoEditor:', error);
                    }
                } else {
                    console.warn('GeoEditor not available, using Geoman fallback');
                }
            };

            map.on('gm:loaded', createEditor);
            setTimeout(() => { createEditor(); }, 1000);
        }
    </script>
</body>
